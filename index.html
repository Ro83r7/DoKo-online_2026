<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b3026">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DoKo 2026">
  <meta name="description" content="Doppelkopf im Browser – gegen drei Bots oder online mit Freunden.">
  <title>DoKo Online 2026</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Startbildschirm -->
  <section id="home" class="screen active">
    <div class="home-card">
      <div class="logo">
        <div class="logo-cards"><div class="mini">♣</div><div class="mini">♥</div></div>
        <div>
          <h1>DoKo <span>2026</span></h1>
          <p>Doppelkopf – mit unseren Hausregeln</p>
        </div>
      </div>
      <div class="panel field">
        <label for="name-input">Dein Name</label>
        <input id="name-input" class="input" maxlength="16" autocomplete="nickname" placeholder="z. B. Robert">
      </div>
      <div class="home-actions">
        <button id="btn-continue" class="btn primary block" hidden>Weiterspielen</button>
        <button id="btn-new" class="btn block">Neue Runde gegen 3 Bots</button>
        <div class="row">
          <button id="btn-online" class="btn">Online mit Freunden</button>
          <button id="btn-settings" class="btn">Regeln &amp; Optionen</button>
        </div>
      </div>
      <div class="panel">
        <div class="section-title" style="margin-top:0">Unsere Regeln</div>
        <div class="rule-chips" id="rule-chips"></div>
      </div>
      <p class="home-foot">Tipp: Auf iPhone/iPad über „Teilen → Zum Home-Bildschirm“ als App installieren.</p>
    </div>
  </section>

  <!-- Spieltisch -->
  <section id="game" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="btn-menu" aria-label="Menü">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="info">
        <div class="title" id="game-title">Doppelkopf</div>
        <div class="sub" id="game-sub"></div>
      </div>
      <button class="icon-btn" id="btn-last" aria-label="Letzter Stich" title="Letzter Stich">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="icon-btn" id="btn-score" aria-label="Punkte" title="Punkte">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </button>
    </div>
    <div class="table" id="table">
      <div class="seat seat-left" id="seat-1"></div>
      <div class="seat seat-top" id="seat-2"></div>
      <div class="seat seat-right" id="seat-3"></div>
      <div class="trick-area" id="trick"></div>
      <div class="center-note" id="center-note"></div>
      <div class="seat-bottom-speech" id="seat-0-speech"></div>
    </div>
    <div class="actionbar" id="actionbar"></div>
    <div class="hand" id="hand"></div>
  </section>

  <div class="modal-wrap" id="modal"><div class="modal" id="modal-body"></div></div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="js/client/app.js"></script>
</body>
</html>
